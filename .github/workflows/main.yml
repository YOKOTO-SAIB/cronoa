name: FYnixorStudio-RDP

on:
  workflow_dispatch:
    inputs:
      heartbeat_minutes:
        description: 'Interval heartbeat ke Telegram (menit)'
        required: false
        default: '15'
      ip_mode:
        description: 'Mode IP: "lama" = pakai IP/cache lama, "baru" = dapatkan IP baru'
        required: false
        default: 'lama'
        type: choice
        options:
          - lama
          - baru

env:
  RDP_HOSTNAME: fynixorstudio
  HEARTBEAT_MINUTES: ${{ github.event.inputs.heartbeat_minutes || '15' }}
  IP_MODE: ${{ github.event.inputs.ip_mode || 'lama' }}

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Helper Functions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\actions | Out-Null

          $helperScript = @'
          function Send-TelegramMessage {
              param(
                  [Parameter(Mandatory=$true)][string]$Token,
                  [Parameter(Mandatory=$true)][string]$ChatId,
                  [Parameter(Mandatory=$true)][string]$Text,
                  [int]$MaxRetries = 3
              )
              $uri = "https://api.telegram.org/bot$Token/sendMessage"
              $body = @{
                  chat_id = $ChatId
                  text = $Text
                  parse_mode = "HTML"
                  disable_web_page_preview = $true
              }
              $attempt = 0
              while ($attempt -lt $MaxRetries) {
                  try {
                      $resp = Invoke-RestMethod -Uri $uri -Method Post -Body $body -TimeoutSec 15
                      if ($resp.ok) { return $true }
                  } catch {
                      Write-Host "Telegram send gagal (percobaan $($attempt+1)): $($_.Exception.Message)"
                  }
                  $attempt++
                  Start-Sleep -Seconds 3
              }
              Write-Host "WARNING: Gagal kirim pesan Telegram setelah $MaxRetries percobaan."
              return $false
          }

          function ConvertTo-HtmlSafe {
              param([string]$Text)
              if ($null -eq $Text) { return "" }
              return $Text.Replace('&','&amp;').Replace('<','&lt;').Replace('>','&gt;')
          }

          function Get-DisplayWidth {
              param([string]$Text)
              $w = 0
              foreach ($ch in $Text.ToCharArray()) {
                  $cp = [int]$ch
                  if ($cp -ge 0xFE00 -and $cp -le 0xFE0F) { continue }
                  elseif ($cp -ge 0x2300 -and $cp -le 0x23FF) { $w += 2 }
                  elseif ($cp -ge 0x2600 -and $cp -le 0x27BF) { $w += 2 }
                  elseif ($cp -ge 0x2B00 -and $cp -le 0x2BFF) { $w += 2 }
                  elseif ($cp -ge 0x1F000 -and $cp -le 0x1FAFF) { $w += 2 }
                  else { $w += 1 }
              }
              return $w
          }

          function Center-Text {
              param([string]$Text, [int]$Width)
              $w = Get-DisplayWidth $Text
              if ($w -ge $Width) { return $Text }
              $padL = [int](($Width - $w) / 2)
              return (" " * $padL) + $Text + (" " * ($Width - $w - $padL))
          }

          function New-Box {
              param(
                  [string]$Title = "",
                  [string[]]$Lines = @()
              )
              $content = @()
              if ($Title) { $content += $Title }
              $content += $Lines
              if ($content.Count -eq 0) { $content += " " }
              $maxW = 4
              foreach ($l in $content) {
                  $w = Get-DisplayWidth $l
                  if ($w -gt $maxW) { $maxW = $w }
              }
              $boxW = $maxW + 4
              $sb = [System.Text.StringBuilder]::new()
              [void]$sb.AppendLine("╔" + ("═" * $boxW) + "╗")
              for ($i = 0; $i -lt $content.Count; $i++) {
                  $l = $content[$i]
                  $w = Get-DisplayWidth $l
                  $pad = $boxW - $w
                  if ($pad -lt 0) { $pad = 0 }
                  [void]$sb.AppendLine("║ " + $l + (" " * $pad) + " ║")
                  if ($Title -and $i -eq 0 -and $content.Count -gt 1) {
                      [void]$sb.AppendLine("╠" + ("═" * $boxW) + "╣")
                  }
              }
              [void]$sb.AppendLine("╚" + ("═" * $boxW) + "╝")
              return $sb.ToString()
          }

          function Get-AsciiBanner {
              param([string]$Subtitle = "REMOTE ACCESS SESSION")
              $title = "⚡  F Y N I X O R  S T U D I O  ⚡"
              $sub   = "◈  $Subtitle  ◈"
              $boxW  = [Math]::Max((Get-DisplayWidth $title), (Get-DisplayWidth $sub)) + 4
              $top   = "╔" + ("═" * $boxW) + "╗"
              $bot   = "╚" + ("═" * $boxW) + "╝"
              $r1    = "║ " + (Center-Text $title $boxW) + " ║"
              $r2    = "║ " + (Center-Text $sub $boxW) + " ║"
              return "<pre>$top`n$r1`n$r2`n$bot</pre>"
          }

          function Get-Divider {
              return "<b>" + ("━" * 40) + "</b>"
          }

          function Get-SystemInfoBlock {
              $os = Get-CimInstance Win32_OperatingSystem
              $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
              $disk = Get-PSDrive C
              $freeGB = [math]::Round($disk.Free / 1GB, 1)
              $totalGB = [math]::Round(($disk.Used + $disk.Free) / 1GB, 1)
              $ramTotalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
              $ramFreeGB = [math]::Round($os.FreePhysicalMemory / 1MB, 1)

              return @"
          💻  <b>OS</b>       :  <code>$(ConvertTo-HtmlSafe $os.Caption)</code>
          ⚙️  <b>CPU</b>      :  <code>$(ConvertTo-HtmlSafe $cpu.Name)</code>
          🧠  <b>RAM</b>      :  <code>$ramFreeGB GB / $ramTotalGB GB</code>
          💾  <b>DISK C:</b>  :  <code>$freeGB GB / $totalGB GB</code>
          "@
          }

          function Format-Duration {
              param([TimeSpan]$Span)
              return "{0}j {1}m {2}s" -f [int]$Span.TotalHours, $Span.Minutes, $Span.Seconds
          }
          '@

          Set-Content -Path C:\actions\helpers.ps1 -Value $helperScript -Encoding UTF8
          Write-Host "Helper functions saved to C:\actions\helpers.ps1"

      - name: Notify - Provisioning Started
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Subtitle "PROVISIONING"
          $msg = @"
          $banner

          🚀  <b>RDP PROVISIONING DIMULAI</b>  ═  <code>fynixorstudio</code>

          ⏳  Estimasi selesai <b>±1-2 menit</b>.
              Kredensial lengkap akan dikirim otomatis ke chat ini.
          "@
          Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $msg | Out-Null

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-FYnixor" | Out-Null
          netsh advfirewall firewall add rule name="RDP-FYnixor" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP core settings applied."

      - name: Create RDP User (Fixed Credentials)
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $env:RDP_USERNAME -Password $securePass
              Write-Host "User $($env:RDP_USERNAME) sudah ada, password di-reset."
          } else {
              New-LocalUser -Name $env:RDP_USERNAME -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME
              Write-Host "User $($env:RDP_USERNAME) baru dibuat."
          }

          if (-not (Get-LocalUser -Name $env:RDP_USERNAME)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed."

      - name: Restore persistent Tailscale identity (IP lama)
        if: env.IP_MODE == 'lama'
        uses: actions/cache/restore@v4
        with:
          path: C:\ProgramData\Tailscale
          key: tailscale-state-fynixorstudio
          restore-keys: |
            tailscale-state-fynixorstudio

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          Stop-Service Tailscale -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          if ($env:IP_MODE -eq 'baru') {
              Write-Host "Mode IP BARU: menghapus identitas/cache Tailscale lama..."
              Remove-Item -Path 'C:\ProgramData\Tailscale\*' -Recurse -Force -ErrorAction SilentlyContinue
          } else {
              Write-Host "Mode IP LAMA: memakai identitas Tailscale dari cache."
          }

          Start-Service Tailscale
          Start-Sleep -Seconds 3

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=$env:RDP_HOSTNAME `
            --accept-dns=true

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP ($env:IP_MODE): $tsIP"

      - name: Save persistent Tailscale identity
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\ProgramData\Tailscale
          key: tailscale-state-fynixorstudio-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Notify - Session Ready (Full Credentials)
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Subtitle "SESSION  AKTIF"
          $sysInfo = Get-SystemInfoBlock
          $divider = Get-Divider

          $credText = @(
              "📍  <b>IP</b>        :  <code>$(ConvertTo-HtmlSafe $env:TAILSCALE_IP)</code>",
              "👤  <b>USER</b>      :  <code>$(ConvertTo-HtmlSafe $env:RDP_USERNAME)</code>",
              "🔑  <b>PASS</b>      :  <code>$(ConvertTo-HtmlSafe $env:RDP_PASSWORD)</code>",
              "🔌  <b>PORT</b>      :  <code>3389</code>"
          ) -join "`n"

          $msg = @"
          $banner

          $divider
          🔥  <b>RDP SERVER  LIVE</b>  ═  <code>fynixorstudio</code>
          $divider

          $credText

          💡  <b>Tips:</b> tap IP / username / password di atas buat langsung salin.

          $divider

          $sysInfo

          $divider

          ⏱  Sesi otomatis berakhir ±350 menit (limit GitHub Actions).
          "@

          Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $msg | Out-Null

      - name: Maintain Connection (Watchdog + Heartbeat)
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          . C:\actions\helpers.ps1

          $startTime = Get-Date
          $heartbeatMinutes = [int]$env:HEARTBEAT_MINUTES
          $lastHeartbeat = $startTime
          $failCount = 0
          $maxFailBeforeAlert = 2

          Write-Host "Watchdog started. Heartbeat tiap $heartbeatMinutes menit."

          while ($true) {
              Start-Sleep -Seconds 60
              $now = Get-Date
              $elapsed = $now - $startTime

              $currentIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
              if (-not $currentIP) {
                  $failCount++
                  Write-Host "[$now] Tailscale IP hilang! Percobaan reconnect ($failCount)..."
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
                      --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
                      --hostname=$env:RDP_HOSTNAME --accept-dns=true 2>$null

                  if ($failCount -ge $maxFailBeforeAlert) {
                      $divider = Get-Divider
                      $alertMsg = @"
                      $divider
                      ⚠️  <b>PERINGATAN — TAILSCALE TERPUTUS</b>
                      $divider

                      Gagal reconnect <b>$failCount kali berturut-turut</b> di runner FYnixorStudio.
                      ⏱  Durasi berjalan:  <code>$(Format-Duration $elapsed)</code>

                      🔄  Sistem akan terus mencoba menyambung ulang secara otomatis…
          "@
                      Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $alertMsg | Out-Null
                      $failCount = 0
                  }
              } else {
                  if ($failCount -gt 0) {
                      $recoverMsg = "✅  <b>Tailscale berhasil pulih otomatis!</b>`n📍  IP:  <code>$(ConvertTo-HtmlSafe $currentIP)</code>"
                      Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $recoverMsg | Out-Null
                  }
                  $failCount = 0
              }

              if (($now - $lastHeartbeat).TotalMinutes -ge $heartbeatMinutes) {
                  $remaining = [TimeSpan]::FromMinutes(350) - $elapsed
                  $sysInfo = Get-SystemInfoBlock
                  $divider = Get-Divider

                  $statusBox = New-Box -Lines @(
                      "🟢  STATUS     :  ALIVE",
                      "📍  IP         :  $(ConvertTo-HtmlSafe $currentIP)",
                      "⏱  UPTIME     :  $(Format-Duration $elapsed)",
                      "⏳  REMAINING  :  $(Format-Duration $remaining)"
                  )

                  $hbMsg = @"
                  $divider
                  💓  <b>HEARTBEAT</b>  ═  FYnixorStudio
                  $divider

                  <pre>$statusBox</pre>

                  $sysInfo
          "@
                  Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $hbMsg | Out-Null
                  $lastHeartbeat = $now
                  Write-Host "[$now] Heartbeat terkirim."
              }
          }

      - name: Notify - Session Ended
        if: always()
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Subtitle "SESSION  BERAKHIR"
          $status = "${{ job.status }}"
          $msg = @"
          $banner

          🔴  <b>SESSION BERAKHIR</b>
          Status job:  <code>$status</code>

          Runner dimatikan / workflow selesai / dibatalkan.
          "@
          Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $msg | Out-Null